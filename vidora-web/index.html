<!doctype html>
<html lang="en" data-theme="vidora-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vidora — Save any YouTube video, any format</title>
    <meta
      name="description"
      content="Vidora is a free, local-first Windows app to save YouTube videos in any format — MP3, MP4, playlists, and more. Files stay on your PC."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vidora — Save any YouTube video, any format" />
    <meta
      property="og:description"
      content="Free, local-first YouTube downloader for Windows. Any format. No account."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vidora — Save any YouTube video, any format" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vidora — Save any YouTube video, any format" />
    <meta
      name="twitter:description"
      content="Save any YouTube video, any format. Free for Windows."
    />
    <meta name="twitter:image" content="/og.png" />
    <meta name="theme-color" content="#0e2024" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("vidora-web-theme");
          if (t === "vidora-light" || t === "vidora-dark") {
            document.documentElement.setAttribute("data-theme", t);
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) {
              m.setAttribute("content", t === "vidora-dark" ? "#0e2024" : "#e7f4f1");
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
